<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#111;color:#eee;font:12px monospace">
<pre id="o">probing</pre>
<script>
const SIZES=[[320,568,'iPhone SE1'],[360,640,'small Android'],[375,667,'iPhone 8'],[390,844,'iPhone 14'],[414,896,'11 Pro Max'],[412,915,'Pixel 7'],[667,375,'landscape']];
const out=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(f,ms=5000){const t=Date.now();while(Date.now()-t<ms){try{if(f())return true}catch{}await wait(50)}return false}
(async()=>{
for(const [w,h,label] of SIZES){
  const f=document.createElement('iframe');f.style.cssText='border:0';f.width=w;f.height=h;f.src='../signup.html';
  await new Promise(r=>{f.onload=r;document.body.appendChild(f)});
  const d=f.contentDocument,win=f.contentWindow,$=id=>d.getElementById(id);
  for(const step of [1,2,3,4]){
    if(step===2){$('name').value='Test Person';$('next').click();await until(()=>$('v2').videoWidth>0);}
    if(step===3){$('next').click();$('next').click();await until(()=>$('v3').videoWidth>0);}
    if(step===4){$('next').click();$('next').click();}
    await wait(120);
    const de=d.documentElement,body=d.body;
    const bar=$('bar').getBoundingClientRect();
    const shell=d.querySelector('.shell').getBoundingClientRect();
    const shot=d.querySelector('#s'+step+' .shot');
    const sr=shot?shot.getBoundingClientRect():null;
    const activeBody=d.querySelector('#s'+step+' .body');
    const ab=activeBody?activeBody.getBoundingClientRect():null;
    out.push([label,w+'x'+h,'step'+step,
      'hscroll='+(de.scrollWidth-de.clientWidth),
      'pageScroll='+(de.scrollHeight-de.clientHeight),
      'barBottom='+Math.round(bar.bottom)+'/'+win.innerHeight,
      'barVisible='+(bar.bottom<=win.innerHeight+1&&bar.top>=0),
      'shellBottom='+Math.round(shell.bottom),
      sr?('shot='+Math.round(sr.width)+'x'+Math.round(sr.height)+' bottom='+Math.round(sr.bottom)+' fits='+(sr.bottom<=win.innerHeight+1)):'shot=-',
      ab?('bodyScroll='+(activeBody.scrollHeight-activeBody.clientHeight)):'-'
    ].join('  '));
  }
  f.remove();
}
document.getElementById('o').textContent=out.join('\n');
await fetch('/result',{method:'POST',body:out.join('\n')});
})();
</script></body></html>
